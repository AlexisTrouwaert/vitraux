# ─────────────────────────────────────────────────────────────────
#  Vitraux Shadows v1.0  —  Iris 1.7+ / OptiFine
#  Minimal shader: only adds colored light projection through
#  semi-transparent blocks (vitraux, stained glass).
#  All other rendering is vanilla-like (no bloom, no dof, no TAA).
# ─────────────────────────────────────────────────────────────────

# Shadow map resolution (higher = sharper shadow edges)
shadow.enabled=true
shadow.size=2048
shadow.distanceRenderMul=-1.0

# Enable a colour buffer in the shadow pass
# shadowcolor0 stores the tint of any coloured glass casting a shadow
shadowcolor0.format=RGBA8

# Do NOT backface-cull in shadow pass so both sides of a pane cast shadows
shadow.cullFace=false

# No fancy post-process effects
ambientOcclusionLevel=1.0
